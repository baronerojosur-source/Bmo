<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#63b8a5">
  <title>BMO OS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <style>
    :root {
      --body-bg: #63b8a5;
      --screen-bg: #c9f7e1;
      --border-col: #223f37;
      --ink-col: #142621;
    }
    body.red-brain {
      --body-bg: #1e0b0e;
      --screen-bg: #3b0910;
      --border-col: #8a1120;
      --ink-col: #ff3b4e;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 14px;
      height: 100dvh;
      background-color: var(--body-bg);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      transition: background-color 0.3s ease;
    }
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }
    .status-pill {
      background: rgba(0, 0, 0, 0.25);
      color: #fff;
      border: 2px solid var(--border-col);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .status-pill.active {
      background: #2a9d8f;
      border-color: #fff;
    }
    #screen {
      width: 100%;
      height: 50dvh;
      background-color: var(--screen-bg);
      border: 10px solid var(--border-col);
      border-radius: 26px;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.2), 0 6px 0 var(--border-col);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      position: relative;
      transition: all 0.3s ease;
    }
    body.red-brain #screen {
      box-shadow: inset 0 0 30px rgba(255, 0, 30, 0.45), 0 6px 0 var(--border-col);
    }
    .face-box {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease-out;
    }
    .eyes-row {
      display: flex;
      gap: 65px;
      margin-bottom: 18px;
    }
    .eye {
      width: 24px;
      height: 24px;
      background-color: var(--ink-col);
      border-radius: 50%;
      transition: height 0.08s ease, transform 0.15s ease;
    }
    .eye.blink {
      height: 4px;
      border-radius: 2px;
    }
    .eye.angry {
      border-radius: 2px;
      transform: rotate(18deg);
      height: 16px;
    }
    .eye.angry.right {
      transform: rotate(-18deg);
    }
    .mouth {
      width: 54px;
      height: 24px;
      border-bottom: 6px solid var(--ink-col);
      border-radius: 0 0 30px 30px;
      transition: all 0.15s ease;
    }
    .mouth.talking {
      height: 28px;
      background-color: var(--ink-col);
      border-radius: 12px 12px 26px 26px;
      animation: talkAnim 0.2s infinite alternate;
    }
    .mouth.evil {
      border-bottom: none;
      border-top: 6px solid var(--ink-col);
      border-radius: 30px 30px 0 0;
      margin-top: 10px;
    }
    @keyframes talkAnim {
      from { transform: scaleY(0.6); }
      to { transform: scaleY(1.15); }
    }
    #speech-text {
      width: 100%;
      background: rgba(255, 255, 255, 0.35);
      color: var(--ink-col);
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: bold;
      text-align: center;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    body.red-brain #speech-text {
      background: rgba(0, 0, 0, 0.45);
    }
    .mid-deck {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
      gap: 12px;
    }
    .slot {
      flex: 1;
      height: 16px;
      background: #142621;
      border-radius: 8px;
      box-shadow: inset 0 3px 5px rgba(0,0,0,0.7);
    }
    .brain-switch {
      background: #2b4c43;
      color: #fff;
      border: 3px solid var(--border-col);
      border-radius: 12px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }
    body.red-brain .brain-switch {
      background: #d90429;
      box-shadow: 0 0 12px #ff2a4b;
    }
    .controls {
      width: 100%;
      height: 31dvh;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(3, 44px);
      gap: 2px;
    }
    .dpad button {
      background: #f4d35e;
      border: 3px solid var(--border-col);
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      color: #142621;
      box-shadow: 0 4px var(--border-col);
    }
    .dpad button:active {
      transform: translateY(3px);
      box-shadow: 0 1px var(--border-col);
    }
    .empty { visibility: hidden; }
    .right-btns {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .btn-pill {
      background: #4ea8de;
      color: #fff;
      border: 3px solid var(--border-col);
      border-radius: 16px;
      padding: 8px 20px;
      font-weight: bold;
      font-size: 13px;
      box-shadow: 0 4px var(--border-col);
    }
    .round-row {
      display: flex;
      gap: 14px;
    }
    .btn-circle {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 4px solid var(--border-col);
      color: #fff;
      font-weight: bold;
      font-size: 12px;
      box-shadow: 0 5px var(--border-col);
    }
    .btn-circle:active, .btn-pill:active {
      transform: translateY(3px);
      box-shadow: 0 1px var(--border-col);
    }
    .green { background: #52b788; }
    .red { background: #e63946; }
    video, canvas { display: none; }
  </style>
</head>
<body>
  <div class="top-bar">
    <button id="camBtn" class="status-pill" onclick="toggleCamera()">ATTIVA OCCHI</button>
    <div id="espStatus" class="status-pill">ESP32: STANDBY</div>
  </div>
  <div id="screen" onclick="handleAction('poke')">
    <div class="face-box" id="faceBox">
      <div class="eyes-row">
        <div class="eye left" id="eyeL"></div>
        <div class="eye right" id="eyeR"></div>
      </div>
      <div class="mouth" id="mouth"></div>
    </div>
    <div id="speech-text">Ciao! Tocca lo schermo o attiva i miei occhi!</div>
  </div>
  <div class="mid-deck">
    <div class="slot" onclick="handleAction('slot')"></div>
    <button class="brain-switch" onclick="toggleRedBrain()">CERVELLO ROSSO</button>
  </div>
  <div class="controls">
    <div class="dpad">
      <div class="empty"></div>
      <button onclick="handleAction('up')">▲</button>
      <div class="empty"></div>
      <button onclick="handleAction('left')">◀</button>
      <div class="empty"></div>
      <button onclick="handleAction('right')">▶</button>
      <div class="empty"></div>
      <button onclick="handleAction('down')">▼</button>
      <div class="empty"></div>
    </div>
    <div class="right-btns">
      <button class="btn-pill" onclick="handleAction('dance')">BALLA</button>
      <div class="round-row">
        <button class="btn-circle green" onclick="handleAction('play')">GIOCA</button>
        <button class="btn-circle red" onclick="handleAction('love')">AMORE</button>
      </div>
    </div>
  </div>
  <video id="camVideo" autoplay playsinline></video>
  <canvas id="camCanvas" width="64" height="48"></canvas>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
    let isRedBrain = false;
    let camActive = false;
    let lastServoAngle = 90;
    let lastGreetTime = 0;

    function speak(text) {
      document.getElementById('speech-text').innerText = text;
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(text);
      msg.lang = 'it-IT';
      msg.pitch = isRedBrain ? 0.55 : 1.65;
      msg.rate = isRedBrain ? 0.88 : 1.08;
      const mouth = document.getElementById('mouth');
      msg.onstart = () => mouth.classList.add('talking');
      msg.onend = () => mouth.classList.remove('talking');
      window.speechSynthesis.speak(msg);
    }

    function sendToESP32(path) {
      fetch(`http://192.168.4.1${path}`, { mode: 'no-cors' })
        .then(() => {
          document.getElementById('espStatus').innerText = 'ESP32: CONNESSO';
          document.getElementById('espStatus').classList.add('active');
        })
        .catch(() => {});
    }

    function toggleRedBrain() {
      isRedBrain = !isRedBrain;
      document.body.classList.toggle('red-brain', isRedBrain);
      const eyeL = document.getElementById('eyeL');
      const eyeR = document.getElementById('eyeR');
      const mouth = document.getElementById('mouth');
      if (isRedBrain) {
        eyeL.classList.add('angry');
        eyeR.classList.add('angry');
        mouth.classList.add('evil');
        speak("Protocollo Cervello Rosso attivato. Ora comando io!");
        sendToESP32('/mode?red=1');
      } else {
        eyeL.classList.remove('angry');
        eyeR.classList.remove('angry');
        mouth.classList.remove('evil');
        speak("Yeee! BMO è tornato normale! Ciao amico!");
        sendToESP32('/mode?red=0');
      }
    }

    function handleAction(type) {
      const normalLines = {
        poke: ["Ehi! Mi fai il solletico!", "Sono un bambino vero!", "Andiamo all'avventura con Finn e Jake!"],
        play: ["Caricamento di Guardiani del Sole!", "Hai fatto un nuovo record!"],
        dance: ["Guarda come balla BMO! Unz unz unz!", "Questa è la mia danza della vittoria!"],
        love: ["BMO ti vuole tanto bene!", "Sei il mio migliore amico!"],
        slot: ["Controllo cassetta: tutto perfetto!"],
        up: ["Salto in alto!"],
        down: ["Mi abbasso!"],
        left: ["Giro a sinistra!"],
        right: ["Giro a destra!"]
      };
      const evilLines = {
        poke: ["Non toccare i miei circuiti!", "Rilevata intrusione umana!"],
        play: ["L'unico gioco qui è la conquista del salotto!"],
        dance: ["I robot malvagi non ballano. Eseguo scansione..."],
        love: ["Errore 404: sentimento non trovato."],
        slot: ["Accesso al nucleo negato!"],
        up: ["Elevazione sensori!"],
        down: ["Abbassamento assetto!"],
        left: ["Rotazione torretta a sinistra!"],
        right: ["Rotazione torretta a destra!"]
      };
      const pool = isRedBrain ? evilLines : normalLines;
      const list = pool[type] || pool.poke;
      const text = list[Math.floor(Math.random() * list.length)];
      speak(text);
      if (type === 'dance') sendToESP32('/action?cmd=dance');
      if (type === 'play' || type === 'love') sendToESP32('/action?cmd=wave');
      if (type === 'left') moveBase(135);
      if (type === 'right') moveBase(45);
    }

    function moveBase(angle) {
      lastServoAngle = angle;
      sendToESP32(`/base?angle=${angle}`);
    }

    setInterval(() => {
      const eyeL = document.getElementById('eyeL');
      const eyeR = document.getElementById('eyeR');
      eyeL.classList.add('blink');
      eyeR.classList.add('blink');
      setTimeout(() => {
        eyeL.classList.remove('blink');
        eyeR.classList.remove('blink');
      }, 160);
    }, 4200);

    async function toggleCamera() {
      const btn = document.getElementById('camBtn');
      const video = document.getElementById('camVideo');
      if (camActive) {
        if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
        camActive = false;
        btn.innerText = 'ATTIVA OCCHI';
        btn.classList.remove('active');
        document.getElementById('faceBox').style.transform = 'translate(0px, 0px)';
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: 320, height: 240 },
          audio: false
        });
        video.srcObject = stream;
        camActive = true;
        btn.innerText = 'OCCHI ATTIVI';
        btn.classList.add('active');
        speak(isRedBrain ? "Ti vedo, umano." : "Oh! Ora ti vedo! Ciao!");
        startTracking();
      } catch (err) {
        speak("Non riesco ad aprire la fotocamera. Controlla i permessi!");
      }
    }

    function startTracking() {
      const video = document.getElementById('camVideo');
      const canvas = document.getElementById('camCanvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const faceBox = document.getElementById('faceBox');
      let prevFrame = null;
      const hasFaceDetector = 'FaceDetector' in window;
      const detector = hasFaceDetector ? new FaceDetector({ fastMode: true, maxDetectedFaces: 1 }) : null;

      async function loop() {
        if (!camActive) return;
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          let normX = 0;
          let detected = false;
          if (detector) {
            try {
              const faces = await detector.detect(video);
              if (faces.length > 0) {
                const box = faces[0].boundingBox;
                const centerX = box.x + box.width / 2;
                normX = -((centerX / video.videoWidth) * 2 - 1);
                detected = true;
              }
            } catch (e) {}
          }
          if (!detected) {
            ctx.drawImage(video, 0, 0, 64, 48);
            const frame = ctx.getImageData(0, 0, 64, 48).data;
            if (prevFrame) {
              let sumX = 0, count = 0;
              for (let y = 0; y < 48; y++) {
                for (let x = 0; x < 64; x++) {
                  const i = (y * 64 + x) * 4;
                  const diff = Math.abs(frame[i] - prevFrame[i]) + Math.abs(frame[i+1] - prevFrame[i+1]);
                  if (diff > 65) {
                    sumX += x;
                    count++;
                  }
                }
              }
              if (count > 25) {
                normX = -((sumX / count / 64) * 2 - 1);
                detected = true;
              }
            }
            prevFrame = new Uint8ClampedArray(frame);
          }
          if (detected) {
            const offsetX = Math.max(-28, Math.min(28, normX * 32));
            faceBox.style.transform = `translateX(${offsetX}px)`;
            const targetAngle = Math.round(90 - normX * 40);
            if (Math.abs(targetAngle - lastServoAngle) > 8) {
              moveBase(targetAngle);
            }
            if (Date.now() - lastGreetTime > 25000) {
              lastGreetTime = Date.now();
              speak(isRedBrain ? "Rilevato movimento nel settore." : "Ehi! Ti ho visto!");
              sendToESP32('/action?cmd=wave');
            }
          }
        }
        setTimeout(loop, 180);
      }
      loop();
    }
  </script>
</body>
</html>
